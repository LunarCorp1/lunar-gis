name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy lunar_gis
      - name: Pytest with coverage
        run: pytest --cov=lunar_gis --cov-report=term-missing --cov-report=xml --cov-fail-under=20 -q
      - name: Build package
        run: python -m build
      - name: Verify QGIS plugin ZIP structure
        run: python -m pytest tests/unit/test_packaging.py::test_qgis_plugin_zip_structure -q
