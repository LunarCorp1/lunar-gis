[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-gis"
version = "0.1.0"
description = "AI-assisted GIS research, analysis, data discovery, provenance, and automatic cartography for QGIS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Lunar Corp" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["lunar_gis"]
