[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-gis"
dynamic = ["version"]
description = "AI-assisted GIS research, analysis, data discovery, provenance, and automatic cartography for QGIS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Lunar Corp" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["lunar_gis*"]

[tool.setuptools.package-data]
lunar_gis = ["metadata.txt", "resources/*"]

[tool.setuptools.dynamic]
version = { attr = "lunar_gis.__version__.__version__" }
